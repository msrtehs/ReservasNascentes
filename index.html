    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            scroll-behavior: smooth;
            background-color: #064e3b; /* Fallback para evitar flashes brancos */
        }
        h1, h2, h3, .font-serif {
            font-family: 'Playfair Display', serif;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        /* Reveal Animations */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: all 1.2s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }
        
        .reveal-left {
            opacity: 0;
            transform: translateX(-50px);
            transition: all 1.2s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .reveal-left.active {
            opacity: 1;
            transform: translateX(0);
        }

        /* Hero Parallax & Zoom */
        @keyframes subtle-zoom {
            from { transform: scale(1.1); }
            to { transform: scale(1); }
        }
        .animate-subtle-zoom {
            animation: subtle-zoom 15s forwards ease-out;
        }

        /* Hover premium */
        .hover-lift {
            transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .hover-lift:hover {
            transform: translateY(-10px);
        }

        /* Slow Pan Background */
        @keyframes slow-pan {
            from { background-position: 0 0; }
            to { background-position: 100% 100%; }
        }
        .animate-slow-pan {
            animation: slow-pan 60s infinite alternate linear;
        }
    </style>
